<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Notifications — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="mobile-dash">
  <div class="dash-layout">
    <div class="main-content">
      <div class="content-area">
        <div class="m-dash">
          <div style="margin-bottom:16px"><a href="dashboard.html" class="btn btn-secondary btn-sm">← Back</a></div>
          <h2 style="margin-bottom:16px">Notifications</h2>
          <div id="notifList" class="m-tx-list"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="m-bottom-nav">
    <a href="dashboard.html" class="m-nav-item"><span class="ico">🏠</span>Home</a>
    <a href="statements.html" class="m-nav-item"><span class="ico">📊</span>Activity</a>
    <a href="transfers.html" class="m-nav-item"><span class="ico">💳</span>Transfer</a>
    <a href="support.html" class="m-nav-item"><span class="ico">💬</span>Support</a>
    <a href="profile.html" class="m-nav-item"><span class="ico">⚙️</span>Settings</a>
  </nav>

  <script src="js/api.js"></script>
  <script>
    if (!requireCustomerPage()) throw 0;
    async function load() {
      try {
        const { notifications } = await api("/api/me/notifications", { auth: "customer" });
        const box = document.getElementById("notifList");
        if (!(notifications || []).length) {
          box.innerHTML = '<div class="m-tx-item"><div class="m-tx-desc">No notifications yet</div></div>';
          return;
        }
        box.innerHTML = notifications.map(n => `
          <div class="m-tx-item" style="${n.isRead ? '' : 'background:#fefce8'}">
            <div class="m-tx-left">
              <div class="m-tx-desc">${n.title}</div>
              <div class="m-tx-date">${n.body}</div>
              <div class="m-tx-date" style="margin-top:4px">${new Date(n.createdAt).toLocaleString()}</div>
            </div>
          </div>
        `).join("");
        // Mark all as read
        for (const n of notifications) {
          if (!n.isRead) {
            await api("/api/me/notifications/" + n.id + "/read", { auth: "customer", method: "POST" }).catch(() => {});
          }
        }
      } catch (e) {
        setToken("");
        location.href = "login.html";
      }
    }
    load();
  </script>
</body>
</html>

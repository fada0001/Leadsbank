<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Messages — Leads Bank Admin</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" alt="" /> Leads Bank</div>
      <nav class="sidebar-nav">
        <a href="admin.html">Dashboard</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-approvals.html">Approvals</a>
        <a href="admin-messages.html" class="active">Messages</a>
        <a href="#" id="logoutAdmin">Sign Out</a>
      </nav>
      <div class="sidebar-footer">Logged in as Owner</div>
    </aside>
    <div class="main-content">
      <div class="topbar"><h2>Customer Care Messages</h2><div class="user-chip"><div class="avatar">AD</div><span>Administrator</span></div></div>
      <div class="content-area">
        <div class="card"><div class="card-header"><h3>Inbox</h3></div><div class="card-body" id="inbox"></div></div>
        <div class="card" id="replyCard" style="display:none;max-width:560px">
          <div class="card-header"><h3>Reply</h3></div>
          <div class="card-body">
            <p id="replyTo" style="font-size:0.85rem;color:var(--text-muted);margin-bottom:12px"></p>
            <div class="success-msg" id="success"></div>
            <form id="replyForm">
              <input type="hidden" id="replyEmail" />
              <div class="form-group"><label>Your reply</label>
                <textarea id="replyBody" required rows="4" style="width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:0.95rem;font-family:inherit;resize:vertical"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Send Reply</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    if (!requireAdminPage()) throw 0;
    async function render() {
      try {
        const { messages } = await api("/api/admin/messages", { auth: "admin" });
        const byEmail = {};
        (messages || []).forEach(m => { if (!byEmail[m.email]) byEmail[m.email] = []; byEmail[m.email].push(m); });
        const box = document.getElementById("inbox");
        if (!Object.keys(byEmail).length) { box.innerHTML = '<p style="color:var(--text-soft)">No messages yet</p>'; return; }
        box.innerHTML = Object.keys(byEmail).map(email => {
          const thread = byEmail[email];
          const last = thread[0];
          return `<div style="border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <div><strong>${last.userName || email}</strong> <span style="font-size:0.8rem;color:var(--text-soft)">${email}</span></div>
              <button class="btn btn-secondary btn-sm" data-email="${email}">Reply</button>
            </div>
            <div style="font-size:0.85rem;color:var(--text-muted)">
              ${thread.slice().reverse().map(m => `<div style="margin-bottom:6px"><strong>${m.from === "admin" ? "Support" : "Customer"}</strong> (${m.date}): ${m.body}</div>`).join("")}
            </div>
          </div>`;
        }).join("");
        box.querySelectorAll("button[data-email]").forEach(btn => {
          btn.onclick = () => {
            document.getElementById("replyCard").style.display = "block";
            document.getElementById("replyEmail").value = btn.dataset.email;
            document.getElementById("replyTo").textContent = "Replying to " + btn.dataset.email;
          };
        });
      } catch (e) { setAdminToken(""); location.href = "admin-login.html"; }
    }
    render();
    document.getElementById("replyForm").onsubmit = async function(e) {
      e.preventDefault();
      try {
        await api("/api/admin/messages/reply", { auth: "admin", method: "POST", body: {
          email: document.getElementById("replyEmail").value,
          body: document.getElementById("replyBody").value.trim()
        }});
        document.getElementById("success").textContent = "Reply sent.";
        document.getElementById("success").style.display = "block";
        document.getElementById("replyBody").value = "";
        render();
      } catch (ex) { alert(ex.message); }
    };
    document.getElementById("logoutAdmin").onclick = e => { e.preventDefault(); setAdminToken(""); location.href = "admin-login.html"; };
  </script>
</body>
</html>

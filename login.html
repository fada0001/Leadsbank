<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Login — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Leads Bank" /> Leads Bank</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html" class="btn btn-outline btn-sm">Open Account</a>
    </nav>
  </header>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Customer Sign In</h1>
      <p class="subtitle">Access your Leads Bank accounts.</p>
      <div class="error-msg" id="error"></div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="you@example.com" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" required placeholder="Enter password" /></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="auth-footer">New customer? <a href="register.html">Open an account</a></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").onsubmit = async function(e) {
      e.preventDefault();
      const err = document.getElementById("error");
      err.style.display = "none";
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: { email: document.getElementById("email").value.trim(), password: document.getElementById("password").value }
        });
        setToken(data.token);
        location.href = "dashboard.html";
      } catch (ex) {
        err.textContent = ex.message; err.style.display = "block";
      }
    };
  </script>
</body>
</html>

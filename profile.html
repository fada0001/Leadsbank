<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" alt="" /> Leads Bank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Overview</a>
        <a href="transfers.html">Transfers</a>
        <a href="statements.html">Statements</a>
        <a href="support.html">Support</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="#" id="logoutLink">Sign Out</a>
      </nav>
      <div class="sidebar-footer" id="sideUser"></div>
    </aside>
    <div class="main-content">
      <div class="topbar"><h2>Profile & Settings</h2><div class="user-chip"><div class="avatar" id="avatar"></div><span id="userName"></span></div></div>
      <div class="content-area">
        <div class="card" style="max-width:560px;margin-bottom:16px">
          <div class="card-header"><h3>Account Details</h3></div>
          <div class="card-body" id="acctDetails" style="font-size:0.9rem;line-height:1.8;color:var(--text-muted)">
            Loading account information...
          </div>
        </div>
        <div class="card" style="max-width:560px">
          <div class="card-header"><h3>Personal Information</h3></div>
          <div class="card-body">
            <div class="error-msg" id="error"></div><div class="success-msg" id="success"></div>
            <form id="profileForm">
              <div class="form-row">
                <div class="form-group"><label>First Name</label><input type="text" id="firstName" required /></div>
                <div class="form-group"><label>Last Name</label><input type="text" id="lastName" required /></div>
              </div>
              <div class="form-group"><label>Email</label><input type="email" id="email" required /></div>
              <div class="form-group"><label>Phone</label><input type="tel" id="phone" required /></div>
              <div class="form-group"><label>Street Address</label><input type="text" id="address" required /></div>
              <div class="form-row">
                <div class="form-group"><label>City</label><input type="text" id="city" required /></div>
                <div class="form-group"><label>State</label><input type="text" id="state" required /></div>
              </div>
              <div class="form-group"><label>ZIP Code</label><input type="text" id="zip" required /></div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
        <div class="card" style="max-width:560px">
          <div class="card-header"><h3>Account Security</h3></div>
          <div class="card-body">
            <div class="error-msg" id="pwError"></div><div class="success-msg" id="pwSuccess"></div>
            <form id="pwForm">
              <div class="form-group"><label>Current Password</label><input type="password" id="currentPw" required /></div>
              <div class="form-group"><label>New Password</label><input type="password" id="newPw" required minlength="8" /></div>
              <div class="form-group"><label>Confirm New Password</label><input type="password" id="newPw2" required /></div>
              <button type="submit" class="btn btn-secondary">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    if (!requireCustomerPage()) throw 0;
    let user;
    async function load() {
      const me = await api("/api/me", { auth: "customer" });
      user = me.user;
      document.getElementById("userName").textContent = user.firstName + " " + user.lastName;
      document.getElementById("avatar").textContent = (user.firstName[0] + user.lastName[0]).toUpperCase();
      document.getElementById("sideUser").textContent = user.email;
      document.getElementById("acctDetails").innerHTML = `
        <strong>Name:</strong> ${user.firstName} ${user.lastName}<br>
        <strong>Email:</strong> ${user.email}<br>
        <strong>Phone:</strong> ${user.phone || "—"}<br>
        <strong>Address:</strong> ${user.address || ""}, ${user.city || ""}, ${user.state || ""} ${user.zip || ""}<br>
        <strong>Account Type:</strong> ${user.accountType}<br>
        <strong>Account Number:</strong> ${user.accountNumber || "—"}<br>
        <strong>Routing Number:</strong> ${user.routingNumber || "—"}<br>
        <strong>Account ID:</strong> ${user.id}<br>
        <strong>Opened:</strong> ${user.createdAt}
      `;
      ["firstName","lastName","email","phone","address","city","state","zip"].forEach(k => {
        document.getElementById(k).value = user[k] || "";
      });
    }
    load().catch(() => { setToken(""); location.href = "login.html"; });
    document.getElementById("profileForm").onsubmit = async function(e) {
      e.preventDefault();
      const err = document.getElementById("error"); const ok = document.getElementById("success");
      err.style.display = ok.style.display = "none";
      try {
        const data = await api("/api/me/profile", { auth: "customer", method: "PUT", body: {
          firstName: document.getElementById("firstName").value.trim(),
          lastName: document.getElementById("lastName").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          state: document.getElementById("state").value.trim(),
          zip: document.getElementById("zip").value.trim()
        }});
        setToken(data.token);
        ok.textContent = "Profile updated."; ok.style.display = "block";
        load();
      } catch (ex) { err.textContent = ex.message; err.style.display = "block"; }
    };
    document.getElementById("pwForm").onsubmit = async function(e) {
      e.preventDefault();
      const err = document.getElementById("pwError"); const ok = document.getElementById("pwSuccess");
      err.style.display = ok.style.display = "none";
      if (document.getElementById("newPw").value !== document.getElementById("newPw2").value) {
        err.textContent = "New passwords do not match."; err.style.display = "block"; return;
      }
      try {
        await api("/api/me/password", { auth: "customer", method: "PUT", body: {
          currentPassword: document.getElementById("currentPw").value,
          newPassword: document.getElementById("newPw").value
        }});
        ok.textContent = "Password updated."; ok.style.display = "block";
        document.getElementById("pwForm").reset();
      } catch (ex) { err.textContent = ex.message; err.style.display = "block"; }
    };
    document.getElementById("logoutLink").onclick = e => { e.preventDefault(); setToken(""); location.href = "login.html"; };
  </script>
</body>
</html>

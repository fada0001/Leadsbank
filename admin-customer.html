<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Detail — Leads Bank Admin</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" alt="" /> Leads Bank</div>
      <nav class="sidebar-nav">
        <a href="admin.html">Dashboard</a>
        <a href="admin-customers.html" class="active">Customers</a>
        <a href="admin-approvals.html">Approvals</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-notifications.html">Send Notification</a>
        <a href="#" id="logoutAdmin">Sign Out</a>
      </nav>
      <div class="sidebar-footer">Logged in as Owner</div>
    </aside>
    <div class="main-content">
      <div class="topbar"><h2>Customer Detail</h2><div class="user-chip"><div class="avatar">AD</div><span>Administrator</span></div></div>
      <div class="content-area" id="content"><p style="color:var(--text-soft)">Loading...</p></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    if (!requireAdminPage()) throw 0;
    const email = new URLSearchParams(location.search).get("email");
    (async function() {
      try {
        const { user, transactions } = await api("/api/admin/customers/" + encodeURIComponent(email), { auth: "admin" });
        const txs = (transactions || []).slice(0, 10);
        document.getElementById("content").innerHTML = `
          <div style="margin-bottom:16px"><a href="admin-customers.html" class="btn btn-secondary btn-sm">← Back</a></div>
          <div class="stats-grid">
            <div class="stat-card"><div class="label">Balance</div><div class="value">${formatMoney(user.balance)}</div><div class="sub">${user.accountType}</div></div>
            <div class="stat-card"><div class="label">Available</div><div class="value">${formatMoney(user.available)}</div><div class="sub">Account ${user.id}</div></div>
            <div class="stat-card"><div class="label">Status</div><div class="value" style="font-size:1.2rem">${user.status || "active"}</div><div class="sub">Opened ${user.createdAt}</div></div>
          </div>
          <div class="card"><div class="card-header"><h3>Profile</h3></div>
            <div class="card-body" style="font-size:0.9rem;line-height:1.85;color:var(--text-muted)">
              <strong>Name:</strong> ${user.firstName} ${user.lastName}<br>
              <strong>Email:</strong> ${user.email}<br>
              <strong>Phone:</strong> ${user.phone}<br>
              <strong>Address:</strong> ${user.address}, ${user.city}, ${user.state} ${user.zip}<br>
              <strong>SSN last 4:</strong> ••••${user.ssnLast4 || "****"}
            </div>
          </div>
          <div class="card"><div class="card-header"><h3>Recent Transactions</h3></div>
            <div class="card-body" style="padding:0"><table>
              <thead><tr><th>Date</th><th>Description</th><th>Type</th><th style="text-align:right">Amount</th></tr></thead>
              <tbody>
                ${txs.map(tx => {
                  const cls = tx.type === "credit" ? "amount-pos" : "amount-neg";
                  const sign = tx.type === "credit" ? "+" : "−";
                  return `<tr><td>${tx.date}</td><td>${tx.desc}</td>
                    <td><span class="badge ${tx.type === "credit" ? "badge-green" : "badge-gray"}">${tx.type}</span></td>
                    <td style="text-align:right" class="${cls}">${sign}${formatMoney(Math.abs(tx.amount))}</td></tr>`;
                }).join("") || '<tr><td colspan="4">No transactions</td></tr>'}
              </tbody>
            </table></div>
          </div>`;
      } catch (e) {
        document.getElementById("content").innerHTML = '<p>Customer not found. <a href="admin-customers.html">Back</a></p>';
      }
    })();
    document.getElementById("logoutAdmin").onclick = e => { e.preventDefault(); setAdminToken(""); location.href = "admin-login.html"; };
  </script>
</body>
</html>

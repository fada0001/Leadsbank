<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statements — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" alt="" /> Leads Bank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Overview</a>
        <a href="transfers.html">Transfers</a>
        <a href="statements.html" class="active">Statements</a>
        <a href="support.html">Support</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutLink">Sign Out</a>
      </nav>
      <div class="sidebar-footer" id="sideUser"></div>
    </aside>
    <div class="main-content">
      <div class="topbar"><h2>Statements & History</h2><div class="user-chip"><div class="avatar" id="avatar"></div><span id="userName"></span></div></div>
      <div class="content-area">
        <div class="stats-grid">
          <div class="stat-card"><div class="label">Current Balance</div><div class="value" id="balance">—</div><div class="sub" id="acctType">Checking</div></div>
          <div class="stat-card"><div class="label">Account Number</div><div class="value" style="font-size:1.15rem" id="acctNum">—</div><div class="sub">Statement account</div></div>
          <div class="stat-card"><div class="label">Transactions</div><div class="value" id="txCount">0</div><div class="sub">In this period</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Account Activity</h3><button class="btn btn-secondary btn-sm" onclick="window.print()">Print / Save</button></div>
          <div class="card-body" style="padding:0">
            <table><thead><tr><th>Date</th><th>Description</th><th>Type</th><th style="text-align:right">Amount</th><th style="text-align:right">Balance</th></tr></thead>
            <tbody id="txBody"></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    if (!requireCustomerPage()) throw 0;
    (async function() {
      try {
        const { user } = await api("/api/me", { auth: "customer" });
        const { transactions } = await api("/api/me/transactions", { auth: "customer" });
        document.getElementById("userName").textContent = user.firstName + " " + user.lastName;
        document.getElementById("avatar").textContent = (user.firstName[0] + user.lastName[0]).toUpperCase();
        document.getElementById("sideUser").textContent = user.email;
        document.getElementById("balance").textContent = formatMoney(user.balance);
        document.getElementById("acctNum").textContent = user.id;
        document.getElementById("acctType").textContent = user.accountType;
        document.getElementById("txCount").textContent = (transactions || []).length;
        let running = 0;
        const withBal = (transactions || []).map(tx => {
          if (tx.type === "credit") running += tx.amount; else running -= tx.amount;
          running = Math.round(running * 100) / 100;
          return { ...tx, running };
        });
        const tbody = document.getElementById("txBody");
        withBal.slice().reverse().forEach(tx => {
          const cls = tx.type === "credit" ? "amount-pos" : "amount-neg";
          const sign = tx.type === "credit" ? "+" : "−";
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${tx.date}</td><td>${tx.desc}</td>
            <td><span class="badge ${tx.type === "credit" ? "badge-green" : "badge-gray"}">${tx.type}</span></td>
            <td style="text-align:right" class="${cls}">${sign}${formatMoney(Math.abs(tx.amount))}</td>
            <td style="text-align:right">${formatMoney(tx.running)}</td>`;
          tbody.appendChild(tr);
        });
      } catch (e) { setToken(""); location.href = "login.html"; }
    })();
    document.getElementById("logoutLink").onclick = e => { e.preventDefault(); setToken(""); location.href = "login.html"; };
  </script>
</body>
</html>

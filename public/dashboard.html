<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Leads Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#071D3D; --gold:#FFC928; --border:#E6E9F0; --muted:#687386; --pos:#1f7a3a; --neg:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; font-size:16px; line-height:1.45; color:#111827; overflow-x:hidden;
      background-color:#e7edf6;
      background-image: radial-gradient(820px 380px at 100% -6%, rgba(255,201,40,.28), transparent 58%), radial-gradient(640px 360px at -8% 8%, rgba(7,29,61,.12), transparent 52%), linear-gradient(180deg, #f7f9fc 0%, #e8eef6 46%, #f4f1e8 100%);
      background-attachment: fixed; }
    button, input, select, textarea { font: inherit; }
    .app { display:flex; min-height:100vh; }
    .side { width:260px; background:#fff; border-radius:0 32px 32px 0; box-shadow:0 4px 24px rgba(7,29,61,.06); padding:24px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
    .logo { display:flex; align-items:center; gap:10px; padding:0 8px 20px; }
    .mark { width:42px; height:42px; border-radius:12px; object-fit:cover; flex:none; }
    .logo h2 { margin:0; font-size:.95rem; letter-spacing:.04em; color:var(--navy); }
    .logo p { margin:2px 0 0; font-size:.72rem; color:var(--muted); }
    .nav a { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px; color:#111827; text-decoration:none; font-size:.92rem; font-weight:600; margin-bottom:2px; }
    .nav a.active { background:#EEF3FF; color:var(--navy); }
    .nav a:hover { background:#f4f6fb; }
    .help { margin-top:auto; background:#f8fafc; border:1px solid var(--border); border-radius:16px; padding:16px; }
    .help p { margin:4px 0 12px; font-size:.78rem; color:var(--muted); }
    .main { flex:1; padding:28px 32px 40px; min-width:0; }
    h1 { margin:0; font-size:1.8rem; color:var(--navy); font-weight:800; }
    .last-login { margin:2px 0 0; color:#5c6b82; font-size:13px; font-weight:500; }
    .field { display:block; font-size:15px; font-weight:600; margin-bottom:10px; }
    .field input, .field select, .field textarea { width:100%; margin-top:4px; padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; font-weight:500; }
    .q strong { display:block; font-size:16px; } .q span { font-size:14px; color:var(--muted); }
    .sec { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:18px; padding:16px 18px; margin-top:14px; }
    .sec > div { flex:1; min-width:140px; }
    .sec .gold { flex:none; }
    .msg { border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; background:#f8fafc; }
    .msg.bank { background:#fff8e6; border-color:#f0e0a8; }
    .msg p { margin:6px 0 0; font-size:16px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .avatar, .bell { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; }
    .avatar { background:#e0e7ff; font-weight:700; color:var(--navy); }
    .bell { border:1px solid var(--border); background:#fff; position:relative; cursor:pointer; }
    .dot { position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--neg); }
    .bal { position:relative; overflow:hidden; background:linear-gradient(135deg,#06244B,#0a3268); border-radius:20px; padding:24px; color:#fff; margin:18px 0; box-shadow:0 12px 30px rgba(6,36,75,.18); }
    .bal-logo { position:absolute; right:-8px; top:-14px; width:132px; height:132px; object-fit:contain; opacity:.2; pointer-events:none; }
    .bal .amt { font-size:2.25rem; font-weight:800; letter-spacing:-.03em; margin:6px 0; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
    .bal-label { display:flex; align-items:center; gap:8px; font-size:14px; letter-spacing:.02em; }
    .eye { width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center; cursor:pointer; padding:0; }
    .empty { display:flex; align-items:center; gap:12px; padding:4px 0 2px; }
    .actions button, .gold, .navybtn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:12px; padding:14px 12px; font-size:16px; font-weight:700; cursor:pointer; }
    .actions button { width:100%; white-space:nowrap; font-size:13.5px; padding:12px 6px; gap:5px; letter-spacing:-.015em; }
    .actions svg, .sec-ico svg { flex:none; display:block; }
    .sec-ico { width:44px; height:44px; border-radius:14px; flex:none; display:grid; place-items:center; background:linear-gradient(180deg,#16386f,#071D3D); color:#FFC928; box-shadow:0 8px 16px rgba(7,29,61,.16); }
    .sec strong { display:block; color:#071D3D; font-size:16px; }
    .gold { background:var(--gold); color:var(--navy); }
    .ghost { background:rgba(255,255,255,.12); color:#fff; }
    .navybtn { background:var(--navy); color:#fff; }
    .card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:0 2px 8px rgba(7,29,61,.04); margin-top:14px; }
    .card h3 { margin:0 0 8px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f1f3f7; }
    .row:last-child { border-bottom:none; }
    .quick { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .q { border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; background:#fff; cursor:pointer; }
    .q .ico, .stmt-ico, .nav-ico { display:grid; place-items:center; color:#071D3D; }
    .q .ico { width:48px; height:48px; margin:0 auto 10px; border-radius:16px; box-shadow:0 8px 16px rgba(7,29,61,.12); }
    .q .ico.navy { background:linear-gradient(180deg,#1a3d78,#071D3D); color:#fff; }
    .q .ico.gold { background:linear-gradient(180deg,#FFE27A,#F5B400); color:#071D3D; }
    .q .ico.blue { background:linear-gradient(180deg,#F4F7FF,#D5E2F8); color:#071D3D; box-shadow:none; }
    .q .ico.ink { background:linear-gradient(180deg,#16386f,#0B2348); color:#FFC928; }
    .stmt-ico { width:40px; height:40px; flex:none; border-radius:12px; background:#EEF3FF; color:#071D3D; }
    .nav-ico { width:34px; height:34px; border-radius:12px; background:#F3F6FB; color:#5C6B82; }
    .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .card-head h3 { margin:0; display:flex; align-items:center; gap:8px; }
    .view { display:none; } .view.on { display:block; }
    .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.04em; }
    .pos { color:var(--pos); font-weight:700; } .neg { color:var(--neg); font-weight:700; }
    .mnav { display:none; }
    .login { max-width:420px; margin:10vh auto; background:#fff; border-radius:24px; padding:24px; border:1px solid var(--border); }
    #gate { display:none; } #gate.on { display:block; }
    #shell { display:none; } #shell.on { display:block; }
    @media (max-width:900px) {
      #ham { display:block !important; }
      .side { position:fixed; left:0; top:0; z-index:36; transform:translateX(-110%); transition:transform .28s ease; border-radius:0 20px 20px 0; }
      .side.open { transform:none; }
      .main { padding:16px; padding-top:68px; }
      .quick, .pair { grid-template-columns:1fr 1fr; }
      h1 { font-size:1.65rem; }
      .mnav { display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); z-index:20; padding:8px 6px calc(10px + env(safe-area-inset-bottom)); }
      .mnav a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:62px; margin:0; border-radius:12px; text-align:center; text-decoration:none; color:#5C6B82; font-size:11px; font-weight:600; letter-spacing:.01em; line-height:1.1; }
      .mnav a svg { display:block; }
      .mnav a.active { color:var(--navy); background:transparent; font-weight:700; }
      .mnav a.active .nav-ico { background:#071D3D; color:#FFC928; }
      .app { padding-bottom:102px; }
    }
  </style>
</head>

    var KEY = "leads_customer_token";

    function token() { return localStorage.getItem(KEY); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        if (c === "&") return "&" + "amp;";

    function api(path, opts) {
      opts = opts || {};

      if (opts.body) headers["Content-Type"] = "application/json";

      headers.Authorization = "Bearer " + tok;

        '<div class="card"><h3>Account activity</h3>' + (S.txs.slice(0,4).map(txRow).join("") || '<div class="empty"><span class="stmt-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 17V7M10 17V4M16 17v-6M22 17H2"/></svg></span><div><strong>No activity yet</strong><div class="meta">Completed deposits and transfers will be listed here.</div></div></div>') + '</div>' +

        '<div class="card">' + line("Bank name", "Leads Bank") + line("Routing number", u.routingNumber) + line("Account number", u.accountNumber) + line("Account holder", holder) + '</div>';

        '<form class="card" id="depForm"><h3>Deposit request</h3><label class="field">Amount<input id="depAmt" inputmode="decimal" placeholder="0.00" required /></label><label class="field">Source of funds<input id="depMemo" placeholder="Payroll, transfer, or other source" required /></label><button class="gold" type="submit">Submit deposit</button></form>' +

    function txMonth(tx) {
      var d = new Date(tx.date);
      if (isNaN(d.getTime())) {
        var now = new Date();
        return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
      }
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function monthName(key) {
      var p = String(key).split("-");
      return new Date(Number(p[0]), Number(p[1]) - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
    }
    function statementRows() {
      var counts = {};
      var keys = [];
      S.txs.forEach(function (t) {
        var k = txMonth(t);
        if (!counts[k]) { counts[k] = 0; keys.push(k); }
        counts[k] += 1;
      });
      if (!keys.length) {
        var n = new Date();
        var k = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0");
        keys.push(k);
        counts[k] = 0;
      }
      keys.sort().reverse();
      return keys.slice(0, 6).map(function (k) {
        var count = counts[k];
        var detail = count ? count + (count === 1 ? " transaction" : " transactions") : "No transactions this month";
        return '<button class="row stmt-dl" type="button" data-month="' + esc(k) + '" style="width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer"><span class="stmt-ico"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 2.8h6.2L19 8.4V20a1.6 1.6 0 0 1-1.6 1.6H7A1.6 1.6 0 0 1 5.4 20V4.4A1.6 1.6 0 0 1 7 2.8zm5.4 1.7V8.6H16.7L12.4 4.5z"/></svg></span><div style="flex:1"><strong>' + esc(monthName(k)) + '</strong><div class="meta">Checking ···· ' + esc(String(S.user.accountNumber || "").slice(-4)) + " · " + esc(detail) + '</div></div><span style="font-weight:700;color:#071D3D">Download</span></button>';
      }).join("");
    }
    function downloadStatement(month) {
      var list = S.txs.filter(function (t) { return !month || txMonth(t) === month; });
      var rows = ["Date,Description,Amount"].concat(list.map(function (t) {
        return String(t.date).replace(/,/g, " ") + "," + String(t.desc).replace(/,/g, " ") + "," + (t.type === "debit" ? "-" : "") + t.amount;
      }));
      var title = month ? monthName(month) : "Account statement";
      var blob = new Blob(["Leads Bank statement\n" + title + "\nAccount " + (S.user.accountNumber || "") + "\nRouting " + (S.user.routingNumber || "") + "\n\n" + rows.join("\n") + "\n"], { type: "text/csv" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "leads-bank-statement" + (month ? "-" + month : "") + ".csv";
      a.click();
      toast("Statement downloaded");
    }
    function line(label, value) { return '<div class="row"><div class="meta">' + esc(label) + '</div><strong>' + esc(value || "") + '</strong></div>'; }
    function copyLine(label, value) { return '<div class="row"><div><div class="meta">' + esc(label) + '</div><strong class="mono">' + esc(value || "") + '</strong></div><button class="gold copy" type="button" data-copy="' + esc(value || "") + '">Copy</button></div>'; }
    function txRow(tx) {
      var pos = tx.type !== "debit";
      return '<div class="row"><div><strong>' + esc(tx.desc) + '</strong><div class="meta">' + esc(tx.date) + '</div></div><div class="' + (pos ? "pos" : "neg") + '">' + (pos ? "+" : "−") + money(Math.abs(tx.amount)) + '</div></div>';
    }
    function wire() {
      document.querySelectorAll("[data-v]").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); show(a.getAttribute("data-v")); }; });
      document.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { show(b.getAttribute("data-go")); }; });
      var eye = document.getElementById("eye"); if (eye) eye.onclick = function () { S.hidden = !S.hidden; paint(); };
      var bell = document.getElementById("bell"); if (bell) bell.onclick = function () { S.notesOpen = !S.notesOpen; paint(); };
      document.querySelectorAll("[data-note]").forEach(function (b) {
        b.onclick = function () { api("/api/me/notifications/" + encodeURIComponent(b.getAttribute("data-note")) + "/read", { method:"POST" }).then(loadAll).catch(function () {}); };
      });
      var stmt = document.getElementById("stmt");
      if (stmt) stmt.onclick = function () { downloadStatement(""); };
      document.querySelectorAll(".stmt-dl").forEach(function (b) {
        b.onclick = function () { downloadStatement(b.getAttribute("data-month")); };
      });
      document.querySelectorAll(".copy").forEach(function (b) { b.onclick = function () { navigator.clipboard.writeText(b.getAttribute("data-copy")).then(function () { toast("Copied"); }, function () { toast(b.getAttribute("data-copy")); }); }; });
      var slip = document.getElementById("copySlip");
      if (slip) slip.onclick = function () {
        var u = S.user;
        navigator.clipboard.writeText(["Bank: Leads Bank", "Routing: " + (u.routingNumber || ""), "Account: " + (u.accountNumber || ""), "Holder: " + u.firstName + " " + u.lastName].join("\n")).then(function () { toast("Instructions copied"); });
      };
      var dep = document.getElementById("depForm");
      if (dep) dep.onsubmit = function (e) {
        e.preventDefault();
        var amount = Number(document.getElementById("depAmt").value);
        var memo = document.getElementById("depMemo").value.trim();
        if (!(amount > 0) || !memo) return toast("Enter an amount and the source of funds");
        api("/api/me/add-funds-request", { method:"POST", body:{ amount: amount, memo: memo } }).then(function () { toast("Deposit submitted for review"); return loadAll(); }).catch(function (ex) { toast(ex.message); });
      };
      var xfer = document.getElementById("xferForm");
      if (xfer) xfer.onsubmit = function (e) {
        e.preventDefault();
        var amount = Number(document.getElementById("xferAmt").value);
        var routing = document.getElementById("beneRouting").value.replace(/\D/g, "");
        var account = document.getElementById("beneAccount").value.replace(/\D/g, "");
        var name = document.getElementById("beneName").value.trim();
        if (!/^\d{9}$/.test(routing)) return toast("Enter a 9-digit routing number");
        if (account.length < 4) return toast("Enter a valid account number");
        if (!name || !(amount > 0)) return toast("Enter the recipient and the amount");
        if (amount > Number(S.user.available)) return toast("This amount exceeds your available balance");
        api("/api/me/transfer-request", { method:"POST", body:{ amount: amount, recipientName: name, recipientAccount: account, routingNumber: routing, memo: document.getElementById("memo").value.trim() } })
          .then(function () { return api("/api/me/beneficiaries", { method:"POST", body:{ name: name, bank: document.getElementById("beneBank").value.trim(), account: account } }).catch(function () {}); })
          .then(function () { toast("Transfer submitted for review"); return loadAll(); })
          .catch(function (ex) { toast(ex.message); });
      };
      var card = document.getElementById("cardForm");
      function saveCard(locked) {
        return api("/api/me/card-controls", { method:"PUT", body:{
          spendLimit: Number(document.getElementById("spendLimit").value) || 500,
          onlineTx: document.getElementById("onlineTx").checked,
          intlTx: document.getElementById("intlTx").checked,
          locked: locked
        }});
      }
      if (card) card.onsubmit = function (e) {
        e.preventDefault();
        var locked = S.card && (S.card.locked === true || S.card.locked === 1);
        saveCard(!!locked).then(function () { toast("Card settings saved"); return loadAll(); }).catch(function (ex) { toast(ex.message); });
      };
      var lock = document.getElementById("lockBtn");
      if (lock) lock.onclick = function () {
        var locked = !(S.card && (S.card.locked === true || S.card.locked === 1));
        saveCard(locked).then(function () { toast(locked ? "Card locked" : "Card unlocked"); return loadAll(); }).catch(function (ex) { toast(ex.message); });
      };
      var msg = document.getElementById("msgForm");
      if (msg) msg.onsubmit = function (e) {
        e.preventDefault();
        var body = document.getElementById("msgBody").value.trim();
        if (!body) return;
        api("/api/me/messages", { method:"POST", body:{ subject:"Support", body: body } }).then(function () { toast("Message sent to Leads Bank"); return loadAll(); }).catch(function (ex) { toast(ex.message); });
      };
      var set = document.getElementById("setForm");
      if (set) set.onsubmit = function (e) {
        e.preventDefault();
        api("/api/me/profile", { method:"PUT", body:{ phone: document.getElementById("phone").value.trim(), address: document.getElementById("address").value.trim(), city: document.getElementById("city").value.trim(), state: document.getElementById("state").value.trim(), zip: document.getElementById("zip").value.trim() } })
          .then(function () { toast("Profile updated"); return loadAll(); }).catch(function (ex) { toast(ex.message); });
      };
      var out = document.getElementById("signOut");
      if (out) out.onclick = function () { localStorage.removeItem(KEY); S.user = null; showGate(); };
    }
    document.getElementById("loginForm").onsubmit = function (e) {
      e.preventDefault();
      var err = document.getElementById("loginErr");
      err.textContent = "";
      fetch("/api/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ email: document.getElementById("loginEmail").value.trim(), password: document.getElementById("loginPassword").value }) })
        .then(function (res) { return res.json().catch(function () { return {}; }).then(function (data) { if (!res.ok) throw new Error(data.error || "Login failed"); return data; }); })
        .then(function (data) { localStorage.setItem(KEY, data.token); return loadAll(); })
        .catch(function (ex) { err.textContent = ex.message; });
    };
    document.getElementById("ham").onclick = function () { document.getElementById("side").classList.add("open"); document.getElementById("overlay").style.display = "block"; };
    document.getElementById("overlay").onclick = function () { document.getElementById("side").classList.remove("open"); this.style.display = "none"; };
    document.getElementById("helpBtn").onclick = function () { show("messages"); };
    if (window.matchMedia("(max-width:900px)").matches) document.getElementById("ham").style.display = "block";
    if (!token()) showGate();
    else loadAll().catch(function () { showGate(); });
    window.addEventListener("hashchange", function () { if (S.user) show((location.hash || "#dash").slice(1)); });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && S.user && S.view === "dash") paint();
    });
  </script>
</body>
</html>

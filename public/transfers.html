<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfers — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="dash-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="assets/logo.png" alt="" /> Leads Bank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Overview</a>
        <a href="transfers.html" class="active">Transfers</a>
        <a href="statements.html">Statements</a>
        <a href="support.html">Support</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutLink">Sign Out</a>
      </nav>
      <div class="sidebar-footer" id="sideUser"></div>
    </aside>
    <div class="main-content">
      <div class="topbar">
        <h2>Transfers</h2>
        <div class="user-chip"><div class="avatar" id="avatar"></div><span id="userName"></span></div>
      </div>
      <div class="content-area">
        <div class="stats-grid" style="grid-template-columns:1fr 1fr">
          <div class="stat-card"><div class="label">Available Balance</div><div class="value" id="availBal">—</div><div class="sub" id="acctLabel">Checking</div></div>
          <div class="stat-card"><div class="label">Account</div><div class="value" style="font-size:1.15rem" id="acctNum">—</div><div class="sub">Source account</div></div>
        </div>
        <div class="card" style="max-width:520px">
          <div class="card-header"><h3>Request a Transfer</h3></div>
          <div class="card-body">
            <div class="error-msg" id="error"></div>
            <div class="success-msg" id="success"></div>
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px">Transfers are submitted for review. An administrator will approve or decline the request.</p>
            <form id="transferForm">
              <div class="form-group"><label>Recipient Name</label><input type="text" id="recipientName" required placeholder="Jane Smith" /></div>
              <div class="form-group"><label>Recipient Account / Email</label><input type="text" id="recipientAcct" required placeholder="Account number or email" /></div>
              <div class="form-group"><label>Amount (USD)</label><input type="number" id="amount" required min="0.01" step="0.01" placeholder="0.00" /></div>
              <div class="form-group"><label>Memo (optional)</label><input type="text" id="memo" placeholder="Rent, invoice, etc." maxlength="60" /></div>
              <button type="submit" class="btn btn-primary btn-block">Submit Transfer Request</button>
            </form>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>Your Transfer Requests</h3></div>
          <div class="card-body" style="padding:0">
            <table><thead><tr><th>Date</th><th>Recipient</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody id="reqBody"></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    if (!requireCustomerPage()) throw 0;
    let user;
    async function load() {
      const me = await api("/api/me", { auth: "customer" });
      user = me.user;
      document.getElementById("userName").textContent = user.firstName + " " + user.lastName;
      document.getElementById("avatar").textContent = (user.firstName[0] + user.lastName[0]).toUpperCase();
      document.getElementById("sideUser").textContent = user.email;
      document.getElementById("availBal").textContent = formatMoney(user.available);
      document.getElementById("acctNum").textContent = user.id;
      document.getElementById("acctLabel").textContent = user.accountType;
      const { requests } = await api("/api/me/requests", { auth: "customer" });
      const tb = document.getElementById("reqBody");
      tb.innerHTML = "";
      if (!(requests || []).length) {
        tb.innerHTML = '<tr><td colspan="4" style="color:var(--text-soft)">No transfer requests yet</td></tr>';
      } else {
        requests.forEach(r => {
          const badge = r.status === "pending" ? "badge-blue" : r.status === "approved" ? "badge-green" : "badge-gray";
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${r.date}</td><td>${r.details}</td><td>${formatMoney(r.amount)}</td>
            <td><span class="badge ${badge}">${r.status}</span></td>`;
          tb.appendChild(tr);
        });
      }
    }
    load().catch(() => { setToken(""); location.href = "login.html"; });
    document.getElementById("transferForm").onsubmit = async function(e) {
      e.preventDefault();
      const err = document.getElementById("error"); const ok = document.getElementById("success");
      err.style.display = ok.style.display = "none";
      try {
        await api("/api/me/transfer-request", {
          auth: "customer", method: "POST",
          body: {
            recipientName: document.getElementById("recipientName").value.trim(),
            recipientAcct: document.getElementById("recipientAcct").value.trim(),
            amount: parseFloat(document.getElementById("amount").value),
            memo: document.getElementById("memo").value.trim()
          }
        });
        ok.textContent = "Transfer request submitted for review.";
        ok.style.display = "block";
        document.getElementById("transferForm").reset();
        load();
      } catch (ex) {
        err.textContent = ex.message; err.style.display = "block";
      }
    };
    document.getElementById("logoutLink").onclick = e => { e.preventDefault(); setToken(""); location.href = "login.html"; };
  </script>
</body>
</html>

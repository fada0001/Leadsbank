<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Support — Leads Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#071D3D; --navy2:#06244B; --gold:#FFC928; --gold2:#F4B900; --bg:#F4F6FB; --border:#E6E9F0; --muted:#687386; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:var(--bg); color:#111827; }
    header { background:linear-gradient(135deg,#06244B,#0a3268); color:#fff; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 12px rgba(7,29,61,0.15); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:36px; height:36px; border-radius:10px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--navy); font-size:0.85rem; }
    header h1 { margin:0; font-size:1.15rem; font-weight:700; letter-spacing:-0.01em; }
    .status { background:rgba(255,255,255,0.12); padding:6px 12px; border-radius:999px; font-size:0.78rem; }
    .wrap { max-width:1200px; margin:0 auto; padding:24px; display:grid; grid-template-columns:340px 1fr; gap:20px; height:calc(100vh - 72px); }
    .panel { background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:0 4px 20px rgba(7,29,61,0.05); display:flex; flex-direction:column; overflow:hidden; }
    .panel-head { padding:18px 20px; border-bottom:1px solid var(--border); font-weight:700; font-size:0.95rem; display:flex; align-items:center; justify-content:space-between; }
    .count { background:#EEF3FF; color:var(--navy); font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:999px; }
    .threads { flex:1; overflow-y:auto; }
    .thread { padding:16px 20px; border-bottom:1px solid #f4f6f9; cursor:pointer; display:flex; gap:12px; align-items:flex-start; transition:background 0.15s; }
    .thread:hover { background:#fafbfd; }
    .thread.active { background:#F4F7FF; border-left:3px solid var(--gold); }
    .avatar { width:40px; height:40px; border-radius:50%; background:#e0e7ff; color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.9rem; flex-shrink:0; }
    .thread-info { flex:1; min-width:0; }
    .thread-info strong { display:block; font-size:0.92rem; }
    .thread-info .preview { font-size:0.8rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .thread-time { font-size:0.72rem; color:var(--muted); flex-shrink:0; }
    .chat { display:flex; flex-direction:column; }
    .chat-head { padding:18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
    .chat-head .name { font-weight:700; }
    .chat-head .sub { font-size:0.75rem; color:var(--muted); }
    .msgs { flex:1; overflow-y:auto; padding:20px; background:#fafbfd; }
    .msg { max-width:70%; margin-bottom:14px; display:flex; flex-direction:column; }
    .msg.customer { align-items:flex-start; }
    .msg.admin { align-items:flex-end; margin-left:auto; }
    .bubble { padding:12px 16px; border-radius:16px; font-size:0.9rem; line-height:1.45; }
    .msg.customer .bubble { background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg.admin .bubble { background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
    .msg .time { font-size:0.68rem; color:var(--muted); margin-top:4px; padding:0 4px; }
    .reply { display:flex; gap:10px; padding:14px 16px; border-top:1px solid var(--border); background:#fff; }
    .reply textarea { flex:1; padding:12px 14px; border:1px solid var(--border); border-radius:12px; resize:none; font-family:inherit; font-size:0.9rem; outline:none; }
    .reply textarea:focus { border-color:var(--gold); }
    .reply button { background:var(--gold); color:var(--navy); border:none; padding:0 22px; border-radius:12px; font-weight:700; cursor:pointer; font-size:0.9rem; }
    .reply button:hover { background:var(--gold2); }
    .empty { color:var(--muted); padding:60px 20px; text-align:center; font-size:0.9rem; }
    @media (max-width:860px) {
      .wrap { grid-template-columns:1fr; height:auto; padding:16px; }
      .panel { height:auto; }
      .msgs { max-height:50vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <a href="admin.html" style="color:#fff;text-decoration:none;margin-right:8px;font-size:1.1rem">←</a>
      <div class="brand-mark">LB</div>
      <h1>Leads Bank · Admin Support</h1>
    </div>
    <div class="status">Online</div>
  </header>
  <div class="wrap">
    <div class="panel">
      <div class="panel-head">
        Conversations
        <span class="count" id="count">0</span>
      </div>
      <div class="threads" id="threads"></div>
    </div>
    <div class="panel chat">
      <div class="chat-head" id="chatHead">
        <div class="avatar">—</div>
        <div>
          <div class="name">No messages yet</div>
          <div class="sub">Customer messages will appear here</div>
        </div>
      </div>
      <div class="msgs" id="msgs">
        <div class="empty">No messages yet</div>
      </div>
      <div class="reply">
        <textarea id="replyText" rows="2" placeholder="Write a reply…"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
  <script>
    const threadsData = [
      { id: 1, customer: "Adeyemi", last: "Thank you, please update me.", time: "2h ago",
        messages: [
          { from: "customer", body: "Hi, my transfer is still pending after 3 hours. Can you check?", time: "14:10" },
          { from: "admin", body: "Hello Adeyemi, I’m looking into that for you right now.", time: "14:25" },
          { from: "customer", body: "Thank you, please update me.", time: "14:30" }
        ]},
      { id: 2, customer: "Chioma", last: "My debit card was declined at a supermarket.", time: "1d ago",
        messages: [
          { from: "customer", body: "My debit card was declined at a supermarket even though I have balance. Please help.", time: "Yesterday" }
        ]}
    ];

    let threads = threadsData;
    let active = null;

    function initials(name) { return name.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase(); }

    function renderThreads() {
      document.getElementById("count").textContent = threads.length;
      const el = document.getElementById("threads");
      if (!threads.length) {
        el.innerHTML = '<div class="empty" style="padding:40px 20px;text-align:center;color:#687386;font-size:0.9rem">No messages yet</div>';
        return;
      }
      el.innerHTML = threads.map(t => `
        <div class="thread ${active && active.id === t.id ? "active" : ""}" data-id="${t.id}">
          <div class="avatar">${initials(t.customer)}</div>
          <div class="thread-info">
            <strong>${t.customer}</strong>
            <div class="preview">${t.last}</div>
          </div>
          <div class="thread-time">${t.time}</div>
        </div>`).join("");
      el.querySelectorAll(".thread").forEach(n => n.onclick = () => openThread(Number(n.dataset.id)));
    }

    function openThread(id) {
      active = threads.find(t => t.id === id);
      document.getElementById("chatHead").innerHTML = `
        <div class="avatar">${initials(active.customer)}</div>
        <div>
          <div class="name">${active.customer}</div>
          <div class="sub">Customer conversation</div>
        </div>`;
      const box = document.getElementById("msgs");
      box.innerHTML = active.messages.map(m => `
        <div class="msg ${m.from}">
          <div class="bubble">${m.body}</div>
          <div class="time">${m.time}</div>
        </div>`).join("");
      box.scrollTop = box.scrollHeight;
      renderThreads();
    }

    document.getElementById("sendBtn").onclick = function() {
      const text = document.getElementById("replyText").value.trim();
      if (!text || !active) return;
      active.messages.push({ from: "admin", body: text, time: new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) });
      active.last = text;
      active.time = "Just now";
      document.getElementById("replyText").value = "";
      openThread(active.id);
    };

    document.getElementById("replyText").onkeydown = function(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("sendBtn").click(); }
    };

    renderThreads();
    if (threads.length) openThread(threads[0].id);
  </script>
</body>
</html>

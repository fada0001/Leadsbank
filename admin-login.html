<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner Login — Leads Bank</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="Leads Bank" /> Leads Bank</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="btn btn-outline btn-sm">Customer Login</a>
    </nav>
  </header>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Owner / Admin Sign In</h1>
      <p class="subtitle">Restricted access for bank administration.</p>
      <div class="error-msg" id="error"></div>
      <form id="adminForm">
        <div class="form-group"><label>Admin Username</label><input type="text" id="username" required placeholder="admin" /></div>
        <div class="form-group"><label>Password</label><input type="password" id="password" required /></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In to Admin</button>
      </form>
      <div class="auth-footer">Customer login is on the main site.</div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    document.getElementById("adminForm").onsubmit = async function(e) {
      e.preventDefault();
      const err = document.getElementById("error");
      err.style.display = "none";
      try {
        const data = await api("/api/admin/login", {
          method: "POST",
          body: { username: document.getElementById("username").value.trim(), password: document.getElementById("password").value }
        });
        setAdminToken(data.token);
        location.href = "admin.html";
      } catch (ex) {
        err.textContent = ex.message; err.style.display = "block";
      }
    };
  </script>
</body>
</html>
